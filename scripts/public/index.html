<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Anime-Sama Mass Extractor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 1000px; margin: 40px auto; padding: 20px; background: #121212; color: #e0e0e0; }
        h1 { color: #00b894; text-align: center; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .column { display: flex; flex-direction: column; }
        label { margin-bottom: 8px; font-weight: bold; color: #00b894; }
        textarea { 
            width: 100%; height: 300px; background: #1e1e1e; color: #fff; 
            border: 2px solid #333; border-radius: 8px; padding: 12px; 
            font-family: monospace; font-size: 13px; box-sizing: border-box; resize: vertical;
        }
        textarea:focus { border-color: #00b894; outline: none; }
        button { 
            background: #00b894; color: white; border: none; padding: 18px; 
            border-radius: 8px; cursor: pointer; font-weight: bold; 
            width: 100%; font-size: 18px; transition: 0.3s;
        }
        button:hover { background: #00947a; transform: translateY(-2px); }
        h3 { margin-top: 30px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        pre { 
            background: #000; padding: 15px; border-radius: 8px; 
            overflow-x: auto; color: #00ff00; border: 1px solid #333;
            min-height: 80px; white-space: pre-wrap; font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>🚀 Mass Extractor Vidmoly</h1>
    
    <div class="grid">
        <div class="column">
            <label>1. URLs Anime-Sama (episodes.js)</label>
            <textarea id="asUrls" placeholder="Lien 1 Anime-Sama&#10;Lien 2 Anime-Sama"></textarea>
        </div>
        <div class="column">
            <label>2. URLs Anilist (pour l'ID)</label>
            <textarea id="aniUrls" placeholder="Lien 1 Anilist&#10;Lien 2 Anilist"></textarea>
        </div>
    </div>
    
    <button onclick="run()">Lancer l'extraction massive</button>
    
    <h3>Résultats du Scan :</h3>
    <pre id="log">En attente des listes...</pre>

    <script>
        async function run() {
            const log = document.getElementById('log');
            const asUrls = document.getElementById('asUrls').value;
            const aniUrls = document.getElementById('aniUrls').value;

            if(!asUrls.trim() || !aniUrls.trim()) {
                return alert("Veuillez remplir les deux champs !");
            }

            log.innerText = "⏳ Traitement en cours sur le serveur...";
            
            try {
                const res = await fetch('/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ asUrls, aniUrls })
                });
                const data = await res.json();
                log.innerText = data.log;
            } catch (err) {
                log.innerText = "❌ Erreur : Impossible de contacter le serveur.";
            }
        }
    </script>
</body>
</html>
